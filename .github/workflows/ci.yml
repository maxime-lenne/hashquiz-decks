name: CI

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  decks:
    name: Check and build decks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate decks
        run: bun run check

      - name: Build site
        run: bun run build
